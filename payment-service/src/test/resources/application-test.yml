server:
  port: 0

spring:
  application:
    name: payment-service-test

  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: false

payment:
  gateway:
    provider-name: TEST_PG
    mock:
      approval-limit: 100000.0000

management:
  endpoints:
    enabled-by-default: false

logging:
  level:
    com.msa.commerce: WARN
    org.springframework: WARN
    org.hibernate: WARN
    ROOT: WARN

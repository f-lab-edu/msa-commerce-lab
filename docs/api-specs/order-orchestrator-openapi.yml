                    shippingAddress:
                      recipientName: "김철수"
                      phone: "010-1234-5678"
                      zipCode: "06234"
                      address: "서울특별시 강남구 테헤란로 123"
                      addressDetail: "456호"
                    orderDate: "2025-10-20T10:30:00"
                    confirmedAt: "2025-10-20T10:35:00"
                    paymentCompletedAt: "2025-10-20T10:40:00"
                    shippedAt: "2025-10-21T14:00:00"

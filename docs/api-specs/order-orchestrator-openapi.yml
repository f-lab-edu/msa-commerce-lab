                    orderNumber: "ORD-20251025-0002"
                    customerId: 1002
                    status: "PAYMENT_PENDING"
                    subtotalAmount: 59800
                    taxAmount: 5980
                    shippingAmount: 3000
                    discountAmount: 0
                    totalAmount: 68780
                    currency: "KRW"
                    shippingAddress:
                      recipientName: "이영희"
